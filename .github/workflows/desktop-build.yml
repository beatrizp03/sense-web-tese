name: Build SENSE Desktop

on:
  push:
    branches: [main, nextjs]
    tags: ["v*"]
  pull_request:
    branches: [main, nextjs]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            target: --win
            worker: python/dist/analysis_worker.exe
            artifacts: apps/sense-desktop/release/*.exe
          - os: macos-latest
            name: macOS
            target: --mac
            worker: python/dist/analysis_worker
            artifacts: apps/sense-desktop/release/*.dmg
          - os: ubuntu-latest
            name: Linux
            target: --linux
            worker: python/dist/analysis_worker
            artifacts: apps/sense-desktop/release/*.AppImage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/sense-desktop/python/requirements.txt

      - name: Install analysis worker dependencies
        working-directory: apps/sense-desktop/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Freeze analysis worker with PyInstaller
        working-directory: apps/sense-desktop
        run: python python/build_worker.py

      - name: Verify frozen binary exists
        working-directory: apps/sense-desktop
        run: test -f ${{ matrix.worker }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the interface as a static export
        run: pnpm --filter sense-web build

      - name: Verify the export exists
        run: test -f apps/sense-web-v2/out/index.html

      - name: Compile the desktop TypeScript modules
        working-directory: apps/sense-desktop
        run: pnpm run build

      - name: Package installer
        working-directory: apps/sense-desktop
        run: npx electron-builder ${{ matrix.target }} --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sense-desktop-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Attach installers to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
          draft: true
          generate_release_notes: true

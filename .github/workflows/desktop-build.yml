name: Build SENSE Desktop

on:
  push:
    branches: [main, nextjs]
  pull_request:
    branches: [main, nextjs]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/sense-desktop/python/requirements.txt

      - name: Install analysis worker dependencies
        working-directory: apps/sense-desktop/python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Freeze analysis worker with PyInstaller
        working-directory: apps/sense-desktop
        run: python python/build_worker.py

      - name: Verify frozen binary exists
        working-directory: apps/sense-desktop
        run: test -f python/dist/analysis_worker.exe

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Electron app
        working-directory: apps/sense-desktop
        run: pnpm run dist:nobuild

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sense-desktop-windows
          path: apps/sense-desktop/release/*.exe
          if-no-files-found: error
